# hypridle config -- drives the screen lifecycle.
#
# This file is shared by BOTH the niri and Hyprland sessions (~/.config/hypr is
# a single symlink into dotfiles/hypr, and both compositors spawn hypridle), so
# it must not reference compositor-specific tooling directly:
#
#   * Locking  -> delegated to the quickshell-bar session-lock service via IPC,
#                 which is compositor-agnostic already.
#   * DPMS     -> delegated to scripts/dpms.sh, which detects the running
#                 compositor and calls hyprctl or `niri msg` accordingly.

general {
    lock_cmd         = qs -p /home/mm-2103/projects/personal/quickshell-bar ipc call lock open
    before_sleep_cmd = qs -p /home/mm-2103/projects/personal/quickshell-bar ipc call lock open
    after_sleep_cmd  = ~/.config/hypr/scripts/dpms.sh on
}

listener {
    timeout    = 300                                                      # 5 min
    on-timeout = qs -p /home/mm-2103/projects/personal/quickshell-bar ipc call lock open
}

listener {
    timeout    = 330                                                      # 5.5 min
    on-timeout = ~/.config/hypr/scripts/dpms.sh off
    on-resume  = ~/.config/hypr/scripts/dpms.sh on
}
