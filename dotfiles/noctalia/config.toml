[bar.default]
center = [ "clock", "media" ]
end = [
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]
font_family = "IosevkaTerm Nerd Font Mono"
reserve_space = false
smart_auto_hide = true

[shell]
font_family = "Iosevka NF"
polkit_agent = true

    [shell.panel]
    floating_layer = "top"

    [shell.screenshot]
    remember_last_region = true

[theme]
builtin = "Gruvbox"
pure_black_dark = true
source = "wallpaper"

[wallpaper]
directory = "/home/mm-2103/Pictures/Wallpaper"

[widget.launcher]
enabled = false

[widget.network]
show_label = false

[widget.tray]
drawer = true

[widget.wallpaper]
enabled = false
