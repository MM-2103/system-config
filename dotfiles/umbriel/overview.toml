# Overview
# Built-in overview and animation values are used. The top-left hot corner is
# off, as in niri: it fires when reaching for a window edge.
# Overview: https://docs.noctalia.dev/umbriel/workspaces-overview/
# Animation: https://docs.noctalia.dev/umbriel/animation/
[hot_corners.top_left]
enabled = false
delay_ms = 500
action = "overview-open"

# Window-rule opacity and blur fade on focus changes by default. Disable this
# independently of border fades, or choose its own duration and curve.
# [animation.windows_opacity]
# enabled = true
# curve = "spring:1,900"
# duration_ms = 250 # For non-spring curves; a spring sets its own length.

# Without a size animation, a resized window shows its stretched old frame until
# it redraws. Wait for the redraws instead (at most 150 ms), then switch to the
# new layout in one frame.
# [animation.windows_resize]
# enabled = false
# wait_for_redraw = true

# Optional live workspace reveal (see docs/user/animation.md).
# Include the bundled preset (adjust /usr for the package prefix), then select it.
# [include]
# files = ["/usr/share/umbriel/effects/animation/workspace_wipe/effect.toml"]
#
# [animation.workspaces]
# style = "reveal"          # Default: "slide"
# effect = "workspace_wipe"
# duration_ms = 300
# curve = "easeout"

# Shade over a window while a modal dialog is attached to it.
# [animation.dialogs]
# dim = 0.3
