# ==============================================================================
# Window rules
# Rules combine in order, with later values overriding earlier ones.
# https://docs.noctalia.dev/umbriel/window-rules/

# Blur windows over the cached wallpaper blur. Set blur_optimized = false to
# include overlapping windows behind them, at a GPU cost on every frame that
# moves anything behind them.
[[window_rule]]
blur = true

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true

# ------------------------------------------------------------------------------
# Ported from dotfiles/niri/rules.kdl. As in niri, matchers are regexes matched
# anywhere in the string, and selectors within one rule must all match. Literal
# strings ('...') keep backslashes as written.

# Zen PiP, fullscreen on the portrait Dell. Overrides the generic PiP rule
# above. Matches host Zen ("zen") and Flatpak ("app.zen_browser.zen").
[[window_rule]]
match.app_id = "zen$"
match.title = "^Picture-in-Picture$"
default_output = "Dell Inc. DELL U2412M YPPY087K0J9U"
default_fullscreen = true
default_floating = true

# Games and launchers open at full column width. Wine and Proton windows
# (\.exe$) include ffxiv_dx11.exe. gamescope was a Hyprland workaround, kept
# because the Steam launch options are shared with that session. Steam's
# popup menus bypass window rules, so the broad match is safe.
[[window_rule]]
match.app_id = ['steam$', 'heroic$', '\.exe$', '^steam_app_[0-9]+$', '^gamescope$']
default_maximize = true

# Umbriel already floats dialogs and attaches portal file choosers to their
# parent, so this covers the windows from these two that open unparented.
[[window_rule]]
match.app_id = ['Pinentry-gtk$', 'xdg-desktop-portal-gtk']
default_floating = true

# Hidden from screenshots and recordings, niri's block-out-from "screen-capture".
[[window_rule]]
match.app_id = ['^org\.keepassxc\.KeePassXC$', '^org\.gnome\.World\.Secrets$']
block_capture = true

